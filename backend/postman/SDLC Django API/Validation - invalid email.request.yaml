$kind: http-request
url: "{{base_url}}/api/user/register/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "validation_example",
      "email": "a@@example.com",
      "password": "TEST_PASSWORD_FROM_PRIVATE_ENV"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 30000
