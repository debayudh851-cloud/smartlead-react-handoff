$kind: http-request
url: "{{base_url}}/api/admin/forgot-password/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{admin_email}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 9000
