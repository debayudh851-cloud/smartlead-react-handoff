$kind: http-request
url: "{{base_url}}/api/admin/reset-password/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "uid": "{{reset_uid}}",
      "token": "{{reset_token}}",
      "new_password": "{{new_admin_password}}",
      "confirm_password": "{{new_admin_password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("HTTP 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 12000
