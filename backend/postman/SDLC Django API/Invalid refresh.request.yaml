$kind: http-request
url: "{{base_url}}/api/token/refresh/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refresh": "invalid"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("HTTP 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 8000
