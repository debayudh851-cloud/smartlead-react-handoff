$kind: http-request
url: "{{base_url}}/api/user/register/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{user_username}}",
      "email": "{{user_email}}",
      "password": "{{user_password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      if (pm.response.code === 201) { const d = pm.response.json(); pm.environment.set("user_access", d.tokens.access); pm.environment.set("user_refresh", d.tokens.refresh); pm.test("Safe user response", () => pm.expect(d.user).not.to.have.property("password")); }
    language: text/javascript
order: 1000
