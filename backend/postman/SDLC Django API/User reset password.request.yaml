$kind: http-request
url: "{{base_url}}/api/user/reset-password/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "uid": "{{user_reset_uid}}",
      "token": "{{user_reset_token}}",
      "new_password": "{{new_user_password}}",
      "confirm_password": "{{new_user_password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 22000
